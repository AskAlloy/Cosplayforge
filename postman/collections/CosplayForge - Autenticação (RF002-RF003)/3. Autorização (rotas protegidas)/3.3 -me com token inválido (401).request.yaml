$kind: http-request
name: 3.3 /me com token inválido (401)
url: "{{baseUrl}}/api/usuarios/me"
method: GET
headers:
  Authorization: Bearer {{tokenInvalido}}
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
