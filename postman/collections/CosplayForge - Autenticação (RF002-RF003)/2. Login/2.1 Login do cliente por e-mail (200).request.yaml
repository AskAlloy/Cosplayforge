$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "login": "cliente1791924824038@teste.com",
      "senha": "{{senhaPadrao}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Retorna token Bearer', () => { pm.expect(j.token).to.be.a('string'); pm.expect(j.tipo).to.eql('Bearer'); });
      pm.collectionVariables.set('tokenCliente', j.token);
    language: text/javascript
order: 1000
