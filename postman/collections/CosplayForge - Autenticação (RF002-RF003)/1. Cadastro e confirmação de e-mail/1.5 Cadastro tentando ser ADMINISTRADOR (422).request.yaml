$kind: http-request
url: "{{baseUrl}}/api/auth/cadastro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Invasor",
      "nomeUsuario": "invasor{{sufixo}}",
      "email": "invasor{{sufixo}}@teste.com",
      "cpf": "{{cpfExtra}}",
      "telefone": "61987654321",
      "senha": "{{senhaPadrao}}",
      "confirmarSenha": "{{senhaPadrao}}",
      "perfil": "ADMINISTRADOR"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
