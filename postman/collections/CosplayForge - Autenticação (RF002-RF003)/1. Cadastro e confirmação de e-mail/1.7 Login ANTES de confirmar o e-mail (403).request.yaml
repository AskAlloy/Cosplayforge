$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "login": "vendedor{{sufixo}}",
      "senha": "{{senhaPadrao}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 7000
