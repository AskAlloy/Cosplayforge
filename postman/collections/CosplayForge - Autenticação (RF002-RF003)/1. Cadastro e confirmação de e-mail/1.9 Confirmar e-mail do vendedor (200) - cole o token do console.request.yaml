$kind: http-request
name: 1.9 Confirmar e-mail do vendedor (200) - cole o token do console em tokenConfirmacaoVendedor
url: "{{baseUrl}}/api/auth/confirmar-email?token={{tokenConfirmacaoVendedor}}"
method: GET
queryParams:
  token: "{{tokenConfirmacaoVendedor}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
