spring.application.name=Cosplayforge

#DataSource
spring.datasource.url = jdbc:mysql://localhost:3306/cosplayforge?useTimezone=true&serverTimezone=UTC
spring.datasource.username =root
spring.datasource.password =root
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

#JPA
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.show_sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#flyway
spring.flyway.enabled=false

#JWT
jwt.secret=${JWT_SECRET:jwt_secret}
jwt.expiration-minutes=120

#Admin
admin.email=${ADMIN_EMAIL:admin@cosplayforge.local}
admin.password=${ADMIN_PASSWORD:admin123}

# simular confirmacao de email
app.base-url=http://localhost:8080

#thymeleaf cache
spring.thymeleaf.cache=false