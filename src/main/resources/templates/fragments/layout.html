<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD comum: recebe o título e a lista de CSS extras (separados por vírgula) -->
<head th:fragment="head(titulo, css)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Caminho base da aplicação; o api.js lê isso para montar as URLs -->
    <meta name="ctx" th:content="@{/}">
    <title th:text="${titulo}">CosplayForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link th:each="c : ${#strings.listSplit(css, ',')}" rel="stylesheet" th:href="@{|/css/${c}.css|}">
</head>

<body>
<!-- Área onde o api.js empilha as mensagens (toasts) -->
<div th:fragment="toasts" id="toasts" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Scripts comuns: Bootstrap + api.js (sessão, fetch, utilitários) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
</th:block>
</body>
</html>
