<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD comum: recebe o título e a lista de CSS extras (separados por vírgula) -->
<head th:fragment="head(titulo, css)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Caminho base da aplicação; o api.js lê isso para montar as URLs -->
    <meta name="ctx" th:content="@{/}">
    <title th:text="${titulo}">CosplayForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link th:each="c : ${#strings.listSplit(css, ',')}" rel="stylesheet" th:href="@{|/css/${c}.css|}">
</head>

<body>
<!-- Área onde o api.js empilha as mensagens (toasts) -->
<div th:fragment="toasts" id="toasts" class="toast-container position-fixed top-0 end-0 p-3"></div>

<!-- Topo das telas do cliente (vitrine, carrinho, pedidos, endereços). O cliente.js preenche a conta e o contador. -->
<header th:fragment="topoCliente" class="vit-topo">

    <div class="vit-container vit-topo-linha">
        <a class="cf-marca" th:href="@{/}"><span class="cf-marca-icone"><i class="bi bi-magic"></i></span>CosplayForge</a>
        <nav class="vit-nav" aria-label="Menu principal">

            <a th:href="@{/}" data-nav="/">Vitrine</a>
            <a th:href="@{/carrinho}" data-nav="/carrinho" data-requer-login class="d-none">
                Carrinho<span id="contadorCarrinho" class="vit-contador d-none">0</span>
            </a>
            <a th:href="@{/pedidos}" data-nav="/pedidos" data-requer-login class="d-none">Meus pedidos</a>
            <a th:href="@{/enderecos}" data-nav="/enderecos" data-requer-login class="d-none">Endereços</a>
        </nav>
        <div id="areaConta" class="d-flex align-items-center gap-2"></div>
    </div>

</header>

<!-- Scripts comuns: Bootstrap + api.js (sessão, fetch, utilitários) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
</th:block>
</body>
</html>
