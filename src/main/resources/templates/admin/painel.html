<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Painel do administrador · CosplayForge', 'painel,admin')}"></head>
<body>
<div th:replace="~{fragments/layout :: toasts}"></div>

<div class="painel-shell">
  <aside class="painel-lateral">
    <div>
      <a class="cf-marca" th:href="@{/admin/painel}"><span class="cf-marca-icone"><i class="bi bi-magic"></i></span>CosplayForge</a>
      <div class="painel-papel">Painel do administrador</div>
    </div>
    <nav class="painel-menu" aria-label="Menu do painel">
      <a href="#resumo" data-secao="resumo"><i class="bi bi-grid"></i>Resumo</a>
      <a href="#lojas" data-secao="lojas"><i class="bi bi-shop"></i>Lojas</a>
      <a href="#usuarios" data-secao="usuarios"><i class="bi bi-people"></i>Usuários</a>
      <a href="#categorias" data-secao="categorias"><i class="bi bi-tags"></i>Categorias</a>
    </nav>
    <div class="painel-rodape">
      <div class="nome" id="nomeUsuario">—</div>
      <button class="btn btn-sm btn-outline-secondary mt-2" id="btnSair"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
    </div>
  </aside>

  <main class="painel-principal">
    <header class="painel-topo"><h1 id="tituloSecao">Resumo</h1></header>

    <!-- RESUMO -->
    <section data-painel="resumo">
      <div class="row g-3">
        <div class="col-6 col-xl-3"><div class="cf-card cf-card-corpo cf-numero"><span class="icone"><i class="bi bi-hourglass-split"></i></span><div><div class="valor" id="numAnalise">–</div><div class="rotulo">Lojas em análise</div></div></div></div>
        <div class="col-6 col-xl-3"><div class="cf-card cf-card-corpo cf-numero"><span class="icone"><i class="bi bi-shop"></i></span><div><div class="valor" id="numAtivas">–</div><div class="rotulo">Lojas ativas</div></div></div></div>
        <div class="col-6 col-xl-3"><div class="cf-card cf-card-corpo cf-numero"><span class="icone"><i class="bi bi-people"></i></span><div><div class="valor" id="numUsuarios">–</div><div class="rotulo">Usuários</div></div></div></div>
        <div class="col-6 col-xl-3"><div class="cf-card cf-card-corpo cf-numero"><span class="icone"><i class="bi bi-tags"></i></span><div><div class="valor" id="numCategorias">–</div><div class="rotulo">Categorias</div></div></div></div>
      </div>
      <div class="cf-card cf-card-corpo mt-4">
        <h2 class="h5">Lojas esperando decisão</h2>
        <div id="listaAnalise" class="text-muted">Carregando...</div>
      </div>
    </section>

    <!-- LOJAS -->
    <section data-painel="lojas" class="d-none">
      <div class="cf-card"><div class="table-responsive">
        <table class="table cf-tabela">
          <thead><tr><th>Loja</th><th>CNPJ</th><th>Proprietário</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
          <tbody id="tbLojas"></tbody>
        </table>
      </div></div>
    </section>

    <!-- USUÁRIOS -->
    <section data-painel="usuarios" class="d-none">
      <input id="buscaUsuario" class="form-control admin-busca mb-3" placeholder="Buscar por nome ou e-mail" aria-label="Buscar usuário">
      <div class="cf-card"><div class="table-responsive">
        <table class="table cf-tabela">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th class="text-end">Ações</th></tr></thead>
          <tbody id="tbUsuarios"></tbody>
        </table>
      </div></div>
    </section>

    <!-- CATEGORIAS -->
    <section data-painel="categorias" class="d-none">
      <div class="row g-3">
        <div class="col-lg-4">
          <form id="formCategoria" class="cf-card cf-card-corpo" novalidate>
            <h2 class="h5" id="tituloCategoria">Nova categoria</h2>
            <input type="hidden" id="catId">
            <div class="mb-3"><label class="form-label" for="catNome">Nome</label><input id="catNome" class="form-control" maxlength="80" required></div>
            <div class="mb-3"><label class="form-label" for="catDescricao">Descrição</label><textarea id="catDescricao" class="form-control" rows="2" maxlength="255"></textarea></div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Salvar categoria</button>
              <button class="btn btn-outline-secondary d-none" type="button" id="catCancelar">Cancelar edição</button>
            </div>
          </form>
        </div>
        <div class="col-lg-8">
          <div class="cf-card"><div class="table-responsive">
            <table class="table cf-tabela">
              <thead><tr><th>Nome</th><th>Descrição</th><th class="text-end">Ações</th></tr></thead>
              <tbody id="tbCategorias"></tbody>
            </table>
          </div></div>
        </div>
      </div>
    </section>
  </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
